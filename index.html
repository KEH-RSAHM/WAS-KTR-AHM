<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Dokumentasi KTR RSJD - Interaktif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F6F9F7; }
        @media print {
            @page { size: 8in 13.5in; margin: 10mm; }
            .no-print { display: none !important; }
            body { background: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-area { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
            input, select, textarea { border: none !important; background: transparent !important; appearance: none; -webkit-appearance: none; }
            input::placeholder, textarea::placeholder { color: transparent; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ path, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {path}
            </svg>
        );

        // Icons
        const icBuilding = <><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></>;
        const icCalendar = <><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></>;
        const icChartCol = <><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>;
        const icClipCheck = <><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></>;
        const icDownload = <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></>;
        const icFileChart = <><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 18v-2"/><path d="M12 18v-4"/><path d="M16 18v-6"/></>;
        const icFileText = <><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></>;
        const icMapPin = <><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></>;
        const icShield = <><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></>;
        const icAlert = <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></>;
        const icSettings = <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></>;
        const icLogOut = <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>;
        const icUser = <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>;
        const icDatabase = <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>;
        const icArrowLeft = <><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>;

        const defaultChecklist = [
            {no:1,sarana:"Papan Tanda KTR Utama (di pintu masuk)",standar:"Minimal 60x90cm, terlihat jelas"},
            {no:2,sarana:"Stiker Dilarang Merokok",standar:"Tiap ruangan, pintu, jendela"},
            {no:3,sarana:"Spanduk KTR",standar:"Area strategis, tidak robek"},
            {no:4,sarana:"Poster Bahaya Rokok",standar:"Area tunggu, edukasi"},
            {no:5,sarana:"Leaflet / Brosur KTR",standar:"Tersedia di resepsionis / pojok KIE"},
            {no:6,sarana:"Pengumuman Audio KTR",standar:"Diputar rutin via pengeras suara"},
            {no:7,sarana:"Tidak tersedia asbak / tempat puntung",standar:"Nihil di seluruh kawasan"},
            {no:8,sarana:"Tidak ada iklan/promosi rokok",standar:"Nihil baliho, poster, penjualan"},
            {no:9,sarana:"Kotak Pengaduan / Hotline KTR",standar:"Nomor aktif & tercatat"},
            {no:10,sarana:"Rompi / ID Card Tim Penegak KTR",standar:"Dipakai saat patroli"}
        ];

        function LoginView({ setView }) {
            return (
                <div className="min-h-screen flex items-center justify-center bg-[#EFF6FF]">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-[#DBEAFE]">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-[#1E40AF] text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <Icon path={icBuilding} className="w-8 h-8" />
                            </div>
                            <h1 className="text-2xl font-bold text-[#1E40AF] font-playfair">Sistem KTR RSJD</h1>
                            <p className="text-sm text-slate-500 mt-1">Silakan masuk ke panel admin</p>
                        </div>
                        <div className="space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-black mb-1.5">Username / Email</label>
                                <input type="text" className="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#1E40AF] focus:ring-1 focus:ring-[#1E40AF]" placeholder="admin@rsjd.com" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-black mb-1.5">Password</label>
                                <input type="password" className="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:outline-none focus:border-[#1E40AF] focus:ring-1 focus:ring-[#1E40AF]" placeholder="••••••••" />
                            </div>
                            <button onClick={() => setView('dashboard')} className="w-full bg-[#1E40AF] text-white font-bold rounded-lg px-4 py-3 mt-4 hover:bg-[#152C7A] transition-all shadow-md">
                                Masuk ke Sistem
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function CPanelView({ setView, supabaseCfg, saveSupabaseCfg, locations, setLocations, users, setUsers }) {
            const [activeMenu, setActiveMenu] = useState('users');
            const [tempUrl, setTempUrl] = useState(supabaseCfg.url);
            const [tempKey, setTempKey] = useState(supabaseCfg.key);
            const [newLoc, setNewLoc] = useState("");

            const handleSaveSupabase = () => {
                saveSupabaseCfg({ url: tempUrl, key: tempKey });
                alert("Pengaturan Koneksi Supabase berhasil disimpan!");
            };

            const addLocation = () => {
                if(newLoc.trim() && !locations.includes(newLoc.trim())) {
                    setLocations([...locations, newLoc.trim()]);
                    setNewLoc("");
                }
            };
            const removeLocation = (loc) => setLocations(locations.filter(l => l !== loc));

            return (
                <div className="min-h-screen bg-[#F6F9F7]">
                    <div className="bg-[#1E40AF] text-white px-6 py-3 flex justify-between items-center shadow-md no-print">
                        <div className="font-bold text-lg flex items-center gap-3">
                            <Icon path={icSettings} className="w-5 h-5"/> Control Panel (C-Panel)
                        </div>
                        <button onClick={() => setView('dashboard')} className="bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2">
                            <Icon path={icArrowLeft} className="w-4 h-4" /> Kembali ke Aplikasi
                        </button>
                    </div>

                    <div className="max-w-[1280px] mx-auto px-4 md:px-8 py-8 flex flex-col md:flex-row gap-6 items-start">
                        {/* Sidebar */}
                        <div className="w-full md:w-64 bg-white rounded-xl shadow-sm border border-[#DBEAFE] overflow-hidden shrink-0">
                            <button onClick={() => setActiveMenu('users')} className={`w-full text-left px-5 py-3.5 font-semibold text-sm border-b border-[#DBEAFE] flex items-center gap-3 transition-colors ${activeMenu === 'users' ? 'bg-[#EFF6FF] text-[#1E40AF]' : 'text-black hover:bg-slate-50'}`}>
                                <Icon path={icUser} className="w-4 h-4"/> Manajemen User
                            </button>
                            <button onClick={() => setActiveMenu('tables')} className={`w-full text-left px-5 py-3.5 font-semibold text-sm border-b border-[#DBEAFE] flex items-center gap-3 transition-colors ${activeMenu === 'tables' ? 'bg-[#EFF6FF] text-[#1E40AF]' : 'text-black hover:bg-slate-50'}`}>
                                <Icon path={icClipCheck} className="w-4 h-4"/> Tabel Referensi
                            </button>
                            <button onClick={() => setActiveMenu('supabase')} className={`w-full text-left px-5 py-3.5 font-semibold text-sm flex items-center gap-3 transition-colors ${activeMenu === 'supabase' ? 'bg-[#EFF6FF] text-[#1E40AF]' : 'text-black hover:bg-slate-50'}`}>
                                <Icon path={icDatabase} className="w-4 h-4"/> Koneksi Supabase
                            </button>
                        </div>

                        {/* Content */}
                        <div className="flex-1 w-full bg-white rounded-xl shadow-sm border border-[#DBEAFE] p-6 md:p-8">
                            {activeMenu === 'users' && (
                                <div>
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-bold text-[#1E40AF]">Manajemen User</h2>
                                        <button className="bg-[#1E40AF] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-opacity-90">+ Tambah User</button>
                                    </div>
                                    <div className="border border-slate-200 rounded-lg overflow-hidden">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-[#1E40AF] text-white">
                                                <tr><th className="px-4 py-3 border-r border-[#152C7A]">Username / Nama</th><th className="px-4 py-3 border-r border-[#152C7A]">Role</th><th className="px-4 py-3 w-24 text-center">Aksi</th></tr>
                                            </thead>
                                            <tbody>
                                                {users.map((u, i) => (
                                                    <tr key={i} className="border-b hover:bg-slate-50">
                                                        <td className="px-4 py-3 font-medium text-black border-r border-slate-200">{u.username}</td>
                                                        <td className="px-4 py-3 border-r border-slate-200">
                                                            <span className="bg-[#DBEAFE] text-[#1E40AF] px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wide uppercase">{u.role}</span>
                                                        </td>
                                                        <td className="px-4 py-3 text-center">
                                                            <button className="text-red-500 hover:text-red-700 font-medium text-xs">Hapus</button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                            {activeMenu === 'tables' && (
                                <div>
                                    <h2 className="text-xl font-bold text-[#1E40AF] mb-4">Tabel Referensi: Lokasi / Area</h2>
                                    <div className="flex gap-2 mb-6 max-w-md">
                                        <input type="text" value={newLoc} onChange={(e)=>setNewLoc(e.target.value)} className="border border-slate-300 rounded-lg px-4 py-2 flex-1 text-sm focus:border-[#1E40AF] outline-none" placeholder="Ketik nama lokasi baru..." />
                                        <button onClick={addLocation} className="bg-[#1E40AF] text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-opacity-90 transition-all">Tambah</button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                        {locations.map((loc, i) => (
                                            <div key={i} className="flex justify-between items-center border border-slate-200 px-3 py-2.5 rounded-lg bg-[#FCFFFD] shadow-sm text-sm">
                                                <span className="font-medium text-black truncate pr-2" title={loc}>{loc}</span>
                                                <button onClick={() => removeLocation(loc)} className="text-red-400 font-bold hover:bg-red-100 w-7 h-7 rounded-md flex items-center justify-center transition-colors shrink-0">×</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {activeMenu === 'supabase' && (
                                <div>
                                    <h2 className="text-xl font-bold text-[#1E40AF] mb-1">Pengaturan Koneksi Supabase</h2>
                                    <p className="text-sm text-slate-500 mb-6">Konfigurasi database backend menggunakan Supabase (Penyimpanan Cloud).</p>
                                    <div className="space-y-5 max-w-xl">
                                        <div>
                                            <label className="block text-sm font-bold text-black mb-1.5">Supabase Project URL</label>
                                            <input type="text" value={tempUrl} onChange={(e)=>setTempUrl(e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:border-[#1E40AF] outline-none font-mono text-black" placeholder="https://xxxx.supabase.co" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-black mb-1.5">Supabase Anon Key</label>
                                            <input type="text" value={tempKey} onChange={(e)=>setTempKey(e.target.value)} className="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:border-[#1E40AF] outline-none font-mono text-black" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />
                                        </div>
                                        <div className="pt-2">
                                            <button onClick={handleSaveSupabase} className="bg-[#1E40AF] text-white px-6 py-2.5 rounded-lg text-sm font-bold hover:bg-opacity-90 transition-all shadow-sm">
                                                Simpan Konfigurasi
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-8 p-5 bg-[#EFF6FF] border border-[#BFDBFE] rounded-xl flex items-start gap-3">
                                        <div className="bg-[#1E40AF] text-white p-2 rounded-lg shrink-0"><Icon path={icDatabase} className="w-5 h-5"/></div>
                                        <div>
                                            <h3 className="font-bold text-[#1E40AF] text-sm mb-1">Status Client Supabase</h3>
                                            <div className="text-xs text-black leading-relaxed">
                                                {supabaseCfg.url && supabaseCfg.key ? 
                                                    <span className="text-green-600 font-semibold">Terkonfigurasi. Instance siap digunakan untuk sinkronisasi data.</span> : 
                                                    <span className="text-amber-600 font-semibold">Belum dikonfigurasi. Harap isi URL dan Anon Key untuk mengaktifkan cloud storage.</span>
                                                }
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function DashboardView({ setView, activeTab, setActiveTab, subTab, setSubTab, locations, setLocations }) {
            const TabBtn = ({ id, label, icon }) => (
                <button 
                    onClick={() => setActiveTab(id)} 
                    className={`flex items-center gap-2 px-4 py-2.5 text-[13px] font-semibold rounded-lg border transition-all whitespace-nowrap ${activeTab === id ? 'bg-[#1E40AF] text-white border-[#1E40AF] shadow-sm' : 'bg-white text-[#1E40AF] border-[#BFDBFE] hover:bg-[#EFF6FF]'}`}
                >
                    <Icon path={icon} className="w-4 h-4" /> {label}
                </button>
            );

            return (
                <div className="min-h-screen">
                    {/* Top Navigation Bar */}
                    <div className="bg-[#1E40AF] text-white px-4 md:px-8 py-2.5 flex justify-between items-center no-print shadow-sm">
                        <div className="text-sm font-semibold flex items-center gap-2">
                            <Icon path={icShield} className="w-4 h-4 text-[#BFDBFE]"/>
                            Sistem Dokumentasi KTR <span className="hidden md:inline font-normal text-[#BFDBFE] px-2">|</span> <span className="hidden md:inline text-xs bg-white/20 px-2 py-0.5 rounded">Admin Mode</span>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setView('cpanel')} className="flex items-center gap-1.5 text-[13px] font-medium hover:text-[#BFDBFE] transition-colors"><Icon path={icSettings} className="w-4 h-4"/> C-Panel</button>
                            <div className="w-px h-4 bg-white/30 my-auto"></div>
                            <button onClick={() => setView('login')} className="flex items-center gap-1.5 text-[13px] font-medium text-red-200 hover:text-white transition-colors"><Icon path={icLogOut} className="w-4 h-4"/> Logout</button>
                        </div>
                    </div>

                    <div className="bg-white border-b border-[#E2EDE6] print-area">
                        <div className="max-w-[1280px] mx-auto px-4 md:px-8 py-4 flex items-center">
                            <img src="KOP ATMA.png" alt="Kop RSJD Atma Husada Mahakam" className="w-full max-h-32 object-contain" />
                        </div>
                    </div>

                    <div className="max-w-[1280px] mx-auto px-4 md:px-8 py-6 md:py-8">
                        <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-4 mb-6 no-print">
                            <div>
                                <h1 className="text-[26px] md:text-[32px] font-bold tracking-tight text-[#1E40AF] leading-[1.1] font-playfair">Sistem Dokumentasi KTR</h1>
                                <p className="text-[13px] md:text-[14px] text-black mt-2 max-w-[620px] leading-relaxed">Paket format resmi pengawasan Kawasan Tanpa Rokok (Interaktif). Anda dapat mengisi langsung data pada form dan mencetak dokumen ini.</p>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="hidden md:flex items-center gap-2 text-[11px] text-black bg-white border border-slate-200 rounded-full px-3 py-1.5">
                                    <Icon path={icShield} className="w-3.5 h-3.5 text-[#1E40AF]" /> Interaktif & Siap Cetak
                                </div>
                                <button onClick={() => window.print()} className="bg-[#1E40AF] text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-opacity-90 transition-all flex gap-2 items-center shadow-sm">
                                    Cetak Form
                                </button>
                            </div>
                        </div>

                        <div className="no-print flex gap-2 overflow-x-auto pb-3 -mx-1 px-1">
                            <TabBtn id="harian" label="1. Kendali Harian" icon={icClipCheck} />
                            <TabBtn id="bulanan" label="2. Kendali Bulanan" icon={icCalendar} />
                            <TabBtn id="rekap" label="3. Rekapitulasi" icon={icChartCol} />
                            <TabBtn id="laporan" label="4. Laporan Bulanan" icon={icFileChart} />
                            <TabBtn id="pendukung" label="5. Pendukung" icon={icFileText} />
                        </div>

                        <div className="bg-white rounded-[16px] border border-[#E2EDE6] shadow-sm overflow-hidden print-area">
                            <div className="flex flex-wrap items-center justify-between gap-3 px-5 md:px-7 py-4 border-b border-[#DBEAFE] bg-[#FFFFFF] no-print">
                                <div className="flex items-center gap-3">
                                    <div className="w-9 h-9 rounded-lg bg-[#1E40AF] text-white flex items-center justify-center shadow-sm">
                                        <Icon path={
                                            activeTab === "harian" ? icClipCheck : 
                                            activeTab === "bulanan" ? icCalendar : 
                                            activeTab === "rekap" ? icChartCol : 
                                            activeTab === "laporan" ? icFileChart : icFileText
                                        } className="w-4 h-4" />
                                    </div>
                                    <div>
                                        <div className="text-[13px] font-bold text-[#1E40AF] leading-none">
                                            {activeTab === "harian" && "FORM-KTR-01 • Kendali Harian Patroli KTR"}
                                            {activeTab === "bulanan" && "FORM-KTR-02 • Kendali Bulanan Patroli KTR"}
                                            {activeTab === "rekap" && "FORM-KTR-03 • Rekapitulasi Bulanan per Area"}
                                            {activeTab === "laporan" && "FORM-KTR-04 • Laporan Bulanan KTR"}
                                            {activeTab === "pendukung" && "FORM-KTR-05 • Dokumen Pendukung KTR"}
                                        </div>

                                                </div>
                                            </div>
                                        )}

                                        {subTab === "teguran" && (
                                            <div className="max-w-[800px] mx-auto border border-slate-300 rounded-xl p-6 md:p-8 bg-white">
                                                <div className="flex justify-between items-start mb-6 text-[12px] text-black font-medium">
                                                    <div className="font-bold">RSJD ATMA HUSADA MAHAKAM<br/><span className="font-normal">Tim Penegakan KTR</span></div>
                                                    <div className="text-right">
                                                        Samarinda, <input type="date" className="border-b border-slate-400 bg-transparent outline-none font-bold" /><br/>
                                                        No: <input type="text" className="border-b border-slate-400 bg-transparent w-32 text-right outline-none font-bold" placeholder=".... /KTR/...." />
                                                    </div>
                                                </div>
                                                
                                                <div className="text-center font-bold text-[14px] flex items-center justify-center gap-2 mb-6 text-black">
                                                    <Icon path={icAlert} className="w-5 h-5 text-[#1E40AF]" /> SURAT TEGURAN PELANGGARAN KTR
                                                </div>

                                                <div className="text-[12px] space-y-4 text-black font-medium">
                                                    <div>
                                                        Kepada Yth,<br/>
                                                        Sdr/i. <input type="text" className="border-b border-slate-400 bg-transparent font-bold w-64 outline-none" /><br/>
                                                        Di - Tempat
                                                    </div>
                                                    <p className="text-justify">Sehubungan dengan pelaksanaan Peraturan Kawasan Tanpa Rokok (KTR) di lingkungan RSJD Atma Husada Mahakam berdasarkan Perda Kaltim No.5/2017, bersama ini kami sampaikan teguran atas pelanggaran:</p>
                                                    
                                                    <div className="border border-slate-200 bg-slate-50 rounded-lg p-4 space-y-2">
                                                        <div className="flex gap-2">
                                                            Hari/Tgl: <input type="text" className="border-b border-slate-400 bg-transparent flex-1 outline-none font-bold" />
                                                            Jam: <input type="time" className="border-b border-slate-400 bg-transparent outline-none font-bold" />
                                                        </div>
                                                        <div className="flex gap-2">
                                                            Lokasi: <input type="text" className="border-b border-slate-400 bg-transparent flex-1 outline-none font-bold" />
                                                        </div>
                                                        <div className="flex gap-2 items-center">
                                                            Pelanggaran: <input type="text" className="border-b border-slate-400 bg-transparent flex-1 outline-none font-bold" placeholder="Contoh: Merokok di area parkir" />
                                                        </div>
                                                    </div>

                                                    <p className="text-justify">Kami harapkan Saudara dapat mematuhi peraturan KTR demi kesehatan bersama dan kenyamanan pasien. Apabila masih melakukan pelanggaran, akan dikenakan sanksi sesuai ketentuan yang berlaku.</p>

                                                    <div className="flex justify-end pt-8">
                                                        <div className="text-center text-[12px]">
                                                            Ketua Tim Penegakan KTR,<br/>
                                                            <div className="h-20"></div>
                                                            <input type="text" placeholder="Nama Lengkap & NIP" className="text-center w-48 bg-transparent border-t border-slate-400 pt-1 outline-none font-bold" />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            // Main Views state
            const [view, setView] = useState("login");
            
            // Dashboard navigation states
            const [activeTab, setActiveTab] = useState("harian");
            const [subTab, setSubTab] = useState("checklist");

            // Global Data states
            const [locations, setLocations] = useState([
                "Lobby Utama", "Poliklinik Terpadu", "IGD", "R. Inap Flamboyan",
                "R. Inap Kenanga", "Kantin / Dapur Gizi", "Area Parkir",
                "Musholla", "Toilet Umum", "Taman / Selasar", "Apotek / Farmasi", "Kantor Manajemen"
            ]);

            const [users, setUsers] = useState([
                { username: "admin_ktr", role: "Superadmin" },
                { username: "petugas_shift1", role: "Petugas" },
                { username: "petugas_shift2", role: "Petugas" }
            ]);

            const [supabaseCfg, setSupabaseCfg] = useState(() => {
                const saved = localStorage.getItem('supabaseCfg');
                return saved ? JSON.parse(saved) : { url: '', key: '' };
            });

            const saveSupabaseCfg = (cfg) => {
                setSupabaseCfg(cfg);
                localStorage.setItem('supabaseCfg', JSON.stringify(cfg));
            };

            // Simple router
            if (view === "login") {
                return <LoginView setView={setView} />;
            }
            if (view === "cpanel") {
                return <CPanelView 
                    setView={setView} 
                    supabaseCfg={supabaseCfg} 
                    saveSupabaseCfg={saveSupabaseCfg} 
                    locations={locations} 
                    setLocations={setLocations}
                    users={users}
                    setUsers={setUsers}
                />;
            }
            return (
                <DashboardView 
                    setView={setView} 
                    activeTab={activeTab} 
                    setActiveTab={setActiveTab}
                    subTab={subTab}
                    setSubTab={setSubTab}
                    locations={locations}
                    setLocations={setLocations}
                />
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

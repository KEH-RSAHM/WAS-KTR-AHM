const defaultPermissions = {
  admin: {input_form:true, tambah_hapus_area:true, cetak_BA:true, cetak_Teguran:true, melihat_laporan:true, mengubah_lokasi:true},
  editor: {input_form:true, tambah_hapus_area:false, cetak_BA:true, cetak_Teguran:true, melihat_laporan:true, mengubah_lokasi:false},
  viewer: {input_form:false, tambah_hapus_area:false, cetak_BA:false, cetak_Teguran:false, melihat_laporan:true, mengubah_lokasi:false}
};
const getUserPermissions = (u) => {
  if(!u) return {};
  if(u.permissions && Object.keys(u.permissions).length>0) return u.permissions;
  return defaultPermissions[u.role] || defaultPermissions.viewer;
};
const can = (u, perm) => {
  const perms = getUserPermissions(u);
  return !!perms[perm];
};

function App(){
  const [page,setPage]=useState('landing');
  const [user,setUser]=useState(null);

  const [locations,setLocations]=useState(defaultLocations);

  const [rbacUsername,setRbacUsername]=useState('');
  const [rbacPassword,setRbacPassword]=useState('');
  const [rbacRole,setRbacRole]=useState('admin');

  const [editingUser,setEditingUser]=useState(null);
  const [showPass,setShowPass]=useState(false);
  const [loginUsername,setLoginUsername]=useState('');
  const [loginPassword,setLoginPassword]=useState('');
  const [loading,setLoading]=useState(false);
  const [dbStatus,setDbStatus]=useState('connecting');
  const [dbErrorDetail,setDbErrorDetail]=useState('');
  const [toast,setToast]=useState(null);
  const supabaseRef = useRef(null);

  const [cfgUrl,setCfgUrl]=useState(localStorage.getItem('ktr_supabase_url') || EMBEDDED_SUPABASE_URL);
  const [cfgAnon,setCfgAnon]=useState(localStorage.getItem('ktr_supabase_anon') || EMBEDDED_SUPABASE_ANON_KEY);
  const [cfgUrlInput,setCfgUrlInput]=useState(cfgUrl);
  const [cfgAnonInput,setCfgAnonInput]=useState(cfgAnon);

  const [showChangePass,setShowChangePass]=useState(false);
  const [oldPassInput,setOldPassInput]=useState('');
  const [newPassInput,setNewPassInput]=useState('');
  const [confirmPassInput,setConfirmPassInput]=useState('');
  const [changePassTarget,setChangePassTarget]=useState(null);

  const [harianList,setHarianList]=useState([]);
  const [bulananList,setBulananList]=useState([]);
  const [rekapList,setRekapList]=useState([]);
  const [laporanList,setLaporanList]=useState([]);
  const [baList,setBaList]=useState([]);
  const [teguranList,setTeguranList]=useState([]);

  const getToday = ()=> new Date().toISOString().split('T')[0];
  const getThisMonth = ()=> new Date().toISOString().slice(0,7);

  const [fTgl,setFTgl]=useState(getToday());
  const [fShift,setFShift]=useState('Pagi');
  const [fWaktu,setFWaktu]=useState('');
  const [fPetugas1,setFPetugas1]=useState('');
  const [fPetugas2,setFPetugas2]=useState('');
  const [harianGrid,setHarianGrid]=useState({});
  const [bulananGrid,setBulananGrid]=useState({});
  const [bulananBulan,setBulananBulan]=useState(getThisMonth());
  const [rekapGrid,setRekapGrid]=useState({});
  const [rekapBulan,setRekapBulan]=useState(getThisMonth());

  const [checklistGrid,setChecklistGrid]=useState({});


  const [lapBulan,setLapBulan]=useState('');
  const [lapRingkasan,setLapRingkasan]=useState('');
  const [lapKendala,setLapKendala]=useState('');
  const [lapRekomendasi,setLapRekomendasi]=useState('');
  const [lapPelapor,setLapPelapor]=useState('');
  const [lapMengetahui,setLapMengetahui]=useState('');
  const [lapDirektur,setLapDirektur]=useState('');

  const [baNomor,setBaNomor]=useState('');
  const [baTgl,setBaTgl]=useState(getToday());
  const [baPetugas1,setBaPetugas1]=useState('');
  const [baJab1,setBaJab1]=useState('');
  const [baPetugas2,setBaPetugas2]=useState('');
  const [baJab2,setBaJab2]=useState('');
  const [baPelanggar,setBaPelanggar]=useState('');
  const [baStatus,setBaStatus]=useState('Karyawan');
  const [baUraian,setBaUraian]=useState('');
  const [baTindak,setBaTindak]=useState('');

  const [tgTglCetak,setTgTglCetak]=useState(getToday());
  const [tgNomor,setTgNomor]=useState('');
  const [tgNama,setTgNama]=useState('');
  const [tgHariTgl,setTgHariTgl]=useState('');
  const [tgJam,setTgJam]=useState('');
  const [tgLokasi,setTgLokasi]=useState('');
  const [tgPelanggaran,setTgPelanggaran]=useState('');
  const [tgKetua,setTgKetua]=useState('');

  const showToast = (msg, type='info')=>{ setToast({msg,type}); setTimeout(()=>setToast(null), 5000); };

  const initSupabase = async (url, anonKey, silent=false) => {
    if(!url || !anonKey){
      setDbStatus('error'); setDbErrorDetail('URL atau ANON KEY kosong');
      if(!silent) showToast('URL & ANON KEY wajib diisi','error');
      return false;
    }
    try{
      setDbStatus('connecting'); setDbErrorDetail('Mencoba konek ke '+url);
      const supabaseLib = window.supabase || window.Supabase || window.supabase_js;
      if(!supabaseLib || !supabaseLib.createClient) throw new Error('Supabase library belum ter-load, cek CDN');
      const client = supabaseLib.createClient(url, anonKey);
      supabaseRef.current = client;
      // Coba query ringan - jika tabel belum ada, tetap anggap konek tapi kasih warning khusus
      const { data, error } = await client.from('ktr_users').select('id').limit(1);
      if(error){
        // Jika error karena tabel tidak ada, tetap anggap konek (karena KEY & URL benar)
        if(error.message && (error.message.includes('does not exist') || error.message.includes('not exist') || error.code==='42P01')){
          setDbStatus('connected'); setDbErrorDetail('');
          setCfgUrl(url); setCfgAnon(anonKey);
          localStorage.setItem('ktr_supabase_url', url);
          localStorage.setItem('ktr_supabase_anon', anonKey);
          if(!silent) showToast('✅ Koneksi OK! Tapi tabel belum ada. Jalankan supabase_schema_v2.sql di SQL Editor Supabase','warning');
          return true;
        } else {
          throw error;
        }
      }
      // Sukses
      setDbStatus('connected'); setDbErrorDetail('');
      setCfgUrl(url); setCfgAnon(anonKey);
      localStorage.setItem('ktr_supabase_url', url);
      localStorage.setItem('ktr_supabase_anon', anonKey);
      if(!silent) showToast('✅ Supabase terhubung ONLINE!','success');
      await refreshAllLists(client);
      const { data: uData } = await client.from('ktr_users').select('*').order('created_at');
      if(uData && uData.length>0) setUsers(uData.map(u=>({username:u.username,role:u.role,password:u.password,permissions:u.permissions,id:u.id})));
      const { data: lData } = await client.from('ktr_locations').select('*').order('created_at');
      if(lData && lData.length>0) setLocations(lData.map(l=>l.name));
      return true;
    }catch(e){
      console.error('Supabase init error:', e);
      setDbStatus('error');
      setDbErrorDetail((e.message||'')+' '+(e.details||'')+' '+(e.hint||''));
      if(!silent) showToast('❌ Gagal konek: '+(e.message||e)+ ' - Cek console untuk detail','error');
      return false;
    }
  };

  useEffect(()=>{
    const savedUser = loadJson('ktr_current_user', null);
    if(savedUser) setUser(savedUser);
    const savedUrl = localStorage.getItem('ktr_supabase_url') || EMBEDDED_SUPABASE_URL;
    const savedAnon = localStorage.getItem('ktr_supabase_anon') || EMBEDDED_SUPABASE_ANON_KEY;
    setCfgUrlInput(savedUrl); setCfgAnonInput(savedAnon);
    initSupabase(savedUrl, savedAnon, true);
  },[]);

  useEffect(()=>{ if(user) saveJson('ktr_current_user', user); else localStorage.removeItem('ktr_current_user'); },[user]);
  useEffect(()=>{
    const next={}; locations.forEach(loc=>{ if(!harianGrid[loc]) next[loc]={waktu:'',merokok:'Tidak',asbak:'Tidak',iklan:'Tidak',pelanggar:0,tindak:'',nama:''}; });
    setHarianGrid(prev=>({...next, ...prev}));
    const nextR={}; locations.forEach(loc=>{ if(!rekapGrid[loc]) nextR[loc]={m1:0,m2:0,m3:0,m4:0,totalBulanIni:0,bulanLalu:0}; });
    setRekapGrid(prev=>({...nextR, ...prev}));
    const nextC={}; defaultChecklist.forEach(item=>{ if(!checklistGrid[item.no]) nextC[item.no]={tersedia:'Ya',kondisi:'Baik',catatan:''}; });
    setChecklistGrid(prev=>({...nextC, ...prev}));
  },[locations]);

  const getSupabase = ()=> supabaseRef.current;

  const refreshAllLists = async(client=null)=>{
    const sb = client || getSupabase();
    if(!sb) return;
    try{
      const [h,b,r,l,ba,t] = await Promise.all([
        sb.from('ktr_harian').select('*').order('tanggal',{ascending:false}).limit(20),
        sb.from('ktr_bulanan').select('*').order('created_at',{ascending:false}).limit(20),
        sb.from('ktr_rekap').select('*').order('created_at',{ascending:false}).limit(20),
        sb.from('ktr_laporan').select('*').order('created_at',{ascending:false}).limit(20),
        sb.from('ktr_ba').select('*').order('created_at',{ascending:false}).limit(20),
        sb.from('ktr_teguran').select('*').order('created_at',{ascending:false}).limit(20)
      ]);
      if(h.data) setHarianList(h.data);
      if(b.data) setBulananList(b.data);
      if(r.data) setRekapList(r.data);
      if(l.data) setLaporanList(l.data);
      if(ba.data) setBaList(ba.data);
      if(t.data) setTeguranList(t.data);
    }catch(e){ console.warn(e.message); }
  };

  const simpanDataSupabase = async()=>{
    const sb = getSupabase();
    if(!sb || dbStatus!=='connected'){ showToast('❌ Supabase belum konek. Cek Control Panel untuk error detail: '+dbErrorDetail,'error'); setPage('control'); return; }
    setLoading(true);
    try{
      const by=user?.username||'anon';
      if(activeTab==='harian'){
        const {error}=await sb.from('ktr_harian').insert([{tanggal:fTgl,shift:fShift,waktu_global:fWaktu,petugas1:fPetugas1,petugas2:fPetugas2,data_grid:harianGrid,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='bulanan'){
        const {error}=await sb.from('ktr_bulanan').insert([{bulan:bulananBulan,data_grid:bulananGrid,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='rekap'){
        const {error}=await sb.from('ktr_rekap').insert([{bulan:rekapBulan,data_grid:rekapGrid,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='laporan'){
        const {error}=await sb.from('ktr_laporan').insert([{bulan:lapBulan,ringkasan:lapRingkasan,kendala:lapKendala,rekomendasi:lapRekomendasi,pelapor:lapPelapor,mengetahui:lapMengetahui,direktur:lapDirektur,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='pendukung' && subTab==='ba'){
        const {error}=await sb.from('ktr_ba').insert([{nomor:baNomor,tanggal:baTgl,petugas1:baPetugas1,jabatan1:baJab1,petugas2:baPetugas2,jabatan2:baJab2,nama_pelanggar:baPelanggar,status_pelanggar:baStatus,uraian_pelanggaran:baUraian,tindak_lanjut:baTindak,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='pendukung' && subTab==='checklist'){
        const {error}=await sb.from('ktr_checklist').insert([{bulan:rekapBulan||bulananBulan||getThisMonth(),data_grid:checklistGrid,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='pendukung' && subTab==='teguran'){
        const {error}=await sb.from('ktr_teguran').insert([{tanggal_cetak:tgTglCetak,nomor_surat:tgNomor,nama_tujuan:tgNama,hari_tgl_pelanggaran:tgHariTgl,jam_pelanggaran:tgJam,lokasi_pelanggaran:tgLokasi,detail_pelanggaran:tgPelanggaran,ketua_tim:tgKetua,created_by:by}]);
        if(error) throw error;
      }
      await refreshAllLists();
      showToast('✅ Berhasil disimpan ONLINE ke Supabase! User lain tinggal Muat Data.','success');
    }catch(err){
      if(err.message && err.message.includes('does not exist')){
        showToast('❌ Tabel belum ada! Jalankan supabase_schema_v2.sql di SQL Editor Supabase dulu','error');
      } else {
        showToast('❌ Gagal simpan: '+err.message,'error');
      }
    }
    setLoading(false);
  };

  const muatDataSupabase = async()=>{
    const sb = getSupabase();
    if(!sb){ showToast('❌ Supabase belum konek','error'); return; }
    setLoading(true);
    try{
      if(activeTab==='harian'){
        const {data,error}=await sb.from('ktr_harian').select('*').eq('tanggal',fTgl).order('created_at',{ascending:false}).limit(1);
        if(error) throw error;
        if(data && data.length>0){ const d=data[0]; setFShift(d.shift||'Pagi'); setFWaktu(d.waktu_global||''); setFPetugas1(d.petugas1||''); setFPetugas2(d.petugas2||''); if(d.data_grid) setHarianGrid(d.data_grid); showToast('Data harian '+fTgl+' dimuat','success'); }
        else showToast('Tidak ada data pada tanggal tersebut.','warning');
      }else if(activeTab==='bulanan'){
        const {data,error}=await sb.from('ktr_bulanan').select('*').eq('bulan',bulananBulan).order('created_at',{ascending:false}).limit(1);
        if(error) throw error;
        if(data && data.length>0){ setBulananGrid(data[0].data_grid||{}); showToast('Bulanan '+bulananBulan+' dimuat','success'); }
      }else if(activeTab==='rekap'){
        const {data,error}=await sb.from('ktr_rekap').select('*').eq('bulan',rekapBulan).order('created_at',{ascending:false}).limit(1);
        if(error) throw error;
        if(data && data.length>0){ setRekapGrid(data[0].data_grid||{}); showToast('Rekap '+rekapBulan+' dimuat','success'); }
      }else if(activeTab==='laporan'){
        const {data,error}=await sb.from('ktr_laporan').select('*').order('created_at',{ascending:false}).limit(1);
        if(error) throw error;
        if(data && data.length>0){ const d=data[0]; setLapBulan(d.bulan||''); setLapRingkasan(d.ringkasan||''); setLapKendala(d.kendala||''); setLapRekomendasi(d.rekomendasi||''); setLapPelapor(d.pelapor||''); setLapMengetahui(d.mengetahui||''); setLapDirektur(d.direktur||''); showToast('Laporan dimuat','success'); }
      }else if(activeTab==='pendukung' && subTab==='ba'){
        const {data,error}=await sb.from('ktr_ba').select('*').order('created_at',{ascending:false}).limit(1);
        if(error) throw error;
        if(data && data.length>0){ const d=data[0]; setBaNomor(d.nomor||''); setBaTgl(d.tanggal||''); setBaPetugas1(d.petugas1||''); setBaJab1(d.jabatan1||''); setBaPetugas2(d.petugas2||''); setBaJab2(d.jabatan2||''); setBaPelanggar(d.nama_pelanggar||''); setBaStatus(d.status_pelanggar||'Karyawan'); setBaUraian(d.uraian_pelanggaran||''); setBaTindak(d.tindak_lanjut||''); showToast('BA dimuat','success'); }
      }else if(activeTab==='pendukung' && subTab==='checklist'){
        const {error}=await sb.from('ktr_checklist').insert([{bulan:rekapBulan||bulananBulan||getThisMonth(),data_grid:checklistGrid,created_by:by}]);
        if(error) throw error;
      }else if(activeTab==='pendukung' && subTab==='teguran'){

  const autoRekapFromCurrentHarian = () => {
    const day = new Date(fTgl).getDate();
    const totalPatroli = Object.values(harianGrid).filter(g => g.waktu && String(g.waktu).trim()!=='').length; // jumlah jam/waktu patroli yang diinput
    const totalPelanggar = Object.values(harianGrid).reduce((s,g) => s + (Number(g.pelanggar)||0), 0);
    // Update bulanan untuk hari ini
    setBulananGrid(prev => {
      const existing = prev[day] || {};
      return {...prev, [day]: {...existing, patroli: totalPatroli, pelanggaran: totalPelanggar, petugas: fPetugas1 || existing.petugas || '', lokasi: existing.lokasi || '' }};
    });
    // Update rekap area - hitung mingguan dari data harian hari ini
    const weekKey = 'm' + Math.min(4, Math.ceil(day/7));
    setRekapGrid(prev => {
      const next = {...prev};
      locations.forEach(loc => {
        const pel = Number(harianGrid[loc]?.pelanggar||0);
        if(!next[loc]) next[loc] = {m1:0,m2:0,m3:0,m4:0,totalBulanIni:0,bulanLalu:0};
        // Untuk auto yang akurat, kita rebuild total bulan ini dari bulananGrid + hari ini
        // Sederhananya, update minggu ini jika ada pelanggar
        if(pel>0){
          // Jika sebelumnya sudah ada nilai di minggu itu untuk hari yang sama, kita ganti bukan tambah - jadi butuh rekap full
          // Untuk V3 ini kita pakai approach tambah, tapi user bisa klik Rekap Full untuk akurat
          next[loc] = {...next[loc], [weekKey]: pel };
        }
      });
      return next;
    });
    showToast('✅ Data harian tgl '+day+' otomatis masuk ke Bulanan & Rekap (minggu '+Math.min(4, Math.ceil(day/7))+')', 'success');
  };

  const autoRekapFullBulan = async (bulanStr) => {
    const sb = getSupabase();
    if(!sb){ showToast('Supabase belum konek','error'); return; }
    setLoading(true);
    try{
      // Ambil semua harian untuk bulan tersebut
      const start = bulanStr + '-01';
      const endDate = new Date(bulanStr + '-01');
      endDate.setMonth(endDate.getMonth()+1);
      const end = endDate.toISOString().slice(0,10);
      const { data, error } = await sb.from('ktr_harian').select('*').gte('tanggal', start).lt('tanggal', end).order('tanggal',{ascending:true});
      if(error) throw error;
      if(!data || data.length===0){
        showToast('Tidak ada data harian untuk bulan '+bulanStr,'warning');
        setLoading(false);
        return;
      }
      // Build bulananGrid baru
      const newBulanan = {...bulananGrid};
      const rekapTemp = {};
      locations.forEach(loc => { rekapTemp[loc] = {m1:0,m2:0,m3:0,m4:0,totalBulanIni:0,bulanLalu:0}; });
      
      // Group by tanggal
      const byDate = {};
      data.forEach(row => {
        byDate[row.tanggal] = row;
      });
      
      for(let d=1; d<=31; d++){
        const dateStr = bulanStr + '-' + String(d).padStart(2,'0');
        const row = byDate[dateStr];
        if(row && row.data_grid){
          const grid = row.data_grid;
          const totalPatroli = Object.values(grid).filter(g => g.waktu && String(g.waktu).trim()!=='').length;
          const totalPelanggar = Object.values(grid).reduce((s,g) => s + (Number(g.pelanggar)||0), 0);
          newBulanan[d] = { ...(newBulanan[d]||{}), patroli: totalPatroli, pelanggaran: totalPelanggar, petugas: row.petugas1 || '' };
          // Untuk rekap
          Object.entries(grid).forEach(([loc, g]) => {
            const pel = Number(g.pelanggar||0);
            if(pel>0){
              const week = Math.min(4, Math.ceil(d/7));
              const wk = 'm'+week;
              if(!rekapTemp[loc]) rekapTemp[loc] = {m1:0,m2:0,m3:0,m4:0,totalBulanIni:0,bulanLalu:0};
              rekapTemp[loc][wk] = (Number(rekapTemp[loc][wk])||0) + pel;
              rekapTemp[loc].totalBulanIni = (Number(rekapTemp[loc].totalBulanIni)||0) + pel;
            }
          });
        }
      }
      setBulananGrid(newBulanan);
      // Merge rekap dengan yang ada (bulan lalu tetap)
      setRekapGrid(prev => {
        const merged = {...prev};
        Object.keys(rekapTemp).forEach(loc => {
          merged[loc] = {...(merged[loc]||{m1:0,m2:0,m3:0,m4:0,totalBulanIni:0,bulanLalu:0}), ...rekapTemp[loc], bulanLalu: merged[loc]?.bulanLalu||0 };
        });
        return merged;
      });
      showToast('✅ Auto-rekap selesai! '+data.length+' hari ditarik, Bulanan & Rekap Area ter-update otomatis','success');
    }catch(e){
      showToast('Gagal auto-rekap: '+e.message,'error');
    }
    setLoading(false);
  };

  if(page==='control'){

        <div className="max-w-[1280px] mx-auto px-8 py-8 grid lg:grid-cols-3 gap-6">

            {dbErrorDetail && <div className="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-xs font-mono text-red-700">Detail Error: {dbErrorDetail}</div>}

            </div>
            <div className="flex gap-2 mt-4"><button onClick={handleSaveSupabaseConfig} disabled={loading} className="bg-[#0B4F30] text-white px-6 py-2.5 rounded-xl font-semibold disabled:opacity-50">{loading?'Menyambungkan...':'Simpan & Test Koneksi ONLINE'}</button><button onClick={()=>{ setCfgUrlInput(EMBEDDED_SUPABASE_URL); setCfgAnonInput(EMBEDDED_SUPABASE_ANON_KEY); }} className="border px-5 py-2.5 rounded-xl font-semibold">Reset ke Embedded Asli</button></div>
            <div className="mt-3 text-[11px] bg-[#F3FBF5] border p-3 rounded-xl">✅ KEY ini sudah embedded di file. User lain tinggal buka file ini tanpa input ulang. Kalau masih ERROR, pastikan sudah <strong>RUN supabase_schema_v2.sql di SQL Editor</strong>. Error "does not exist" = tabel belum dibuat.</div>
          </div>

          <div className="lg:col-span-2 bg-white border rounded-[28px] p-6">
            <div className="flex justify-between items-center mb-4"><div className="text-lg font-bold text-[#0B4F30]">User Management ONLINE</div>{editingUser&&<span className="text-xs bg-amber-100 text-amber-700 px-3 py-1 rounded-full">Edit {editingUser}</span>}</div>
            <div className="grid md:grid-cols-3 gap-3 mb-4"><input value={rbacUsername} onChange={e=>setRbacUsername(e.target.value)} placeholder="Username" className="border rounded-xl px-3 py-2.5"/><div className="relative"><input type={showPass?'text':'password'} value={rbacPassword} onChange={e=>setRbacPassword(e.target.value)} placeholder="Password" className="border rounded-xl px-3 py-2.5 w-full pr-12"/><button onClick={()=>setShowPass(!showPass)} className="absolute right-2 top-1/2 -translate-y-1/2 text-[11px]">{showPass?'Hide':'Show'}</button></div><select value={rbacRole} onChange={e=>{const r=e.target.value; setRbacRole(r); if(r==='admin') setRbacPerms(defaultPermissions.admin); else if(r==='editor') setRbacPerms(defaultPermissions.editor); else setRbacPerms(defaultPermissions.viewer);}} className="border rounded-xl px-3 py-2.5"><option value="admin">Admin</option><option value="editor">Editor</option><option value="viewer">Viewer</option></select></div>
            <div className="border rounded-xl p-3 mb-4 bg-[#FCFFFD]"><div className="text-[11px] font-bold text-[#0B4F30] mb-2">HAK AKSES GRANULAR</div><div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-xs">{Object.keys(defaultPermissions.admin).map(perm=>(<label key={perm} className="flex items-center gap-2 border rounded-lg px-2 py-2 bg-white"><input type="checkbox" checked={rbacPerms[perm]||false} onChange={e=>setRbacPerms({...rbacPerms,[perm]:e.target.checked})} />{perm.replaceAll('_',' ')}</label>))}</div></div>

            <div className="flex gap-2"><button onClick={addUser} className={`flex-1 ${editingUser?'bg-amber-600':'bg-[#0B4F30]'} text-white py-2.5 rounded-xl font-semibold`}>{editingUser?'Update Pengguna':'Simpan Pengguna'}</button>{editingUser&&<button onClick={cancelEditUser} className="border px-5 rounded-xl">Batal</button>}</div>
            <table className="w-full text-sm mt-6"><thead><tr className="text-[11px] uppercase text-slate-400 border-b"><th className="text-left py-2">User</th><th className="text-left">Role</th><th className="text-left">Pass</th><th className="text-right">Aksi</th></tr></thead><tbody>{users.map((u,i)=><tr key={i} className="border-b"><td className="py-3"><strong>{u.username}</strong>{u.username===user.username&&<span className="ml-2 text-[10px] bg-[#0B4F30] text-white px-2 py-0.5 rounded-full">YOU</span>}</td><td><span className={`text-[11px] px-2 py-1 rounded-full ${u.role==='admin'?'bg-purple-100 text-purple-700':u.role==='editor'?'bg-blue-100 text-blue-700':'bg-slate-100'}`}>{u.role}</span></td><td className="font-mono text-xs">{u.password}</td><td className="text-right"><div className="flex justify-end gap-1"><button onClick={()=>startEditUser(u)} className="border px-2.5 py-1 rounded-lg text-xs">Edit</button><button onClick={()=>openChangePassword(u.username)} className="border border-amber-200 text-amber-700 px-2.5 py-1 rounded-lg text-xs">Pass</button><button onClick={()=>removeUser(u.username)} className="border border-red-200 text-red-600 px-2.5 py-1 rounded-lg text-xs">Hapus</button></div></td></tr>)}</tbody></table>

          <div className="bg-white border rounded-[28px] p-6"><div className="font-bold text-[#0B4F30] mb-4">Lokasi (Supabase ONLINE)</div><input value={locName} onChange={e=>setLocName(e.target.value)} placeholder="Nama lokasi baru" className="w-full border rounded-xl px-3 py-2.5 mb-2"/><button onClick={addLocation} className="w-full bg-[#0B4F30] text-white py-2.5 rounded-xl mb-4">Tambah Lokasi</button><div className="space-y-1 max-h-[400px] overflow-y-auto">{locations.map((loc,i)=><div key={i} className="flex justify-between items-center border rounded-xl px-3 py-2"><span>{loc}</span><button onClick={()=>removeLocation(loc)} className="text-red-600 text-xs border border-red-200 px-2 py-1 rounded-full">Hapus</button></div>)}</div></div>
        </div>
        {showChangePass&&<div className="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-4"><div className="bg-white rounded-[24px] p-6 w-full max-w-md"><div className="font-bold mb-4">Ganti Password {changePassTarget||''}</div><div className="space-y-3">{(!changePassTarget||changePassTarget===user.username)&&<input type="password" value={oldPassInput} onChange={e=>setOldPassInput(e.target.value)} placeholder="Password Lama" className="w-full border rounded-xl px-3 py-2.5"/>}<input type="password" value={newPassInput} onChange={e=>setNewPassInput(e.target.value)} placeholder="Password Baru" className="w-full border rounded-xl px-3 py-2.5"/><input type="password" value={confirmPassInput} onChange={e=>setConfirmPassInput(e.target.value)} placeholder="Konfirmasi" className="w-full border rounded-xl px-3 py-2.5"/></div><div className="flex gap-2 mt-5"><button onClick={()=>setShowChangePass(false)} className="flex-1 border rounded-xl py-2.5">Batal</button><button onClick={handleChangePassword} className="flex-1 bg-[#0B4F30] text-white rounded-xl py-2.5">Simpan</button></div></div></div>}
        {toast&&<div className={`fixed bottom-10 left-1/2 -translate-x-1/2 px-5 py-3 rounded-xl text-sm font-bold shadow-xl z-[200] max-w-[90%] text-center ${toast.type==='error'?'bg-red-600 text-white':'bg-[#0B4F30] text-white'}`}>{toast.msg}</div>}
      </div>
    );
  }

  return (
    <div className="min-h-screen pb-28">
      <div className="bg-white border-b sticky top-0 z-20">
        <div className="max-w-[1280px] mx-auto px-4 md:px-8 py-4 flex flex-col lg:flex-row justify-between gap-3">
          <div><div className="text-[11px] tracking-[0.18em] font-bold text-[#0B4F30]/70 uppercase flex items-center gap-2">PEMERINTAH PROVINSI KALTIM <span className={`px-2 py-0.5 rounded-full text-[9px] border ${dbStatus==='connected'?'bg-emerald-50 border-emerald-200 text-emerald-700':'bg-red-50 border-red-200 text-red-700'}`}>{dbStatus.toUpperCase()} ONLINE ONLY</span></div><div className="text-[18px] md:text-[22px] font-bold text-[#0B4F30]">RSJD ATMA HUSADA MAHAKAM</div><div className="text-[12px] font-semibold text-slate-700">TIM KTR — Jl. Kakap No.23, Samarinda</div></div>
          <div className="flex flex-wrap gap-2 items-center"><span className="text-xs bg-[#F3FBF5] border px-3 py-1.5 rounded-full">Login: <strong>{user.username}</strong> ({user.role})</span><button onClick={()=>openChangePassword()} className="rounded-full border border-[#0B4F30] text-[#0B4F30] px-3 py-2 text-xs font-bold flex items-center gap-1"><Icon path={icLock} className="w-3 h-3"/>Ganti Password</button><button onClick={()=>setPage('landing')} className="rounded-full border px-4 py-2 text-sm">Landing</button>{user.role==='admin'&&<button onClick={()=>setPage('control')} className="rounded-full border px-4 py-2 text-sm">Control Panel</button>}<button onClick={logout} className="rounded-full bg-[#0B4F30] text-white px-4 py-2 text-sm">Logout</button></div>
        </div>
      </div>

      <div className="max-w-[1280px] mx-auto px-4 md:px-8 py-6">
        {dbStatus!=='connected' && (
          <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl">
            <div className="text-sm text-red-800 font-bold">Supabase belum terhubung ONLINE</div>
            <div className="text-xs text-red-700 mt-1 font-mono break-all">Error: {dbErrorDetail}</div>
            <div className="text-xs text-red-700 mt-2">Solusi:<br/>1. Buka Supabase SQL Editor {'>'} Run <strong>supabase_schema_v2.sql</strong> (jika error "does not exist")<br/>2. Cek URL & KEY di Control Panel<br/>3. Klik Simpan & Test Koneksi</div>
            <button onClick={()=>setPage('control')} className="mt-3 bg-red-600 text-white px-4 py-2 rounded-xl text-sm">Ke Control Panel Config</button>
          </div>
        )}
        <div className="bg-white rounded-[16px] border shadow-sm overflow-hidden">
          <div className="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-b bg-[#FBFFFC]">
            <div className="flex items-center gap-3"><div className="w-9 h-9 rounded-lg bg-[#0B4F30] text-white flex items-center justify-center"><Icon path={activeTab==='harian'?icClipCheck:activeTab==='bulanan'?icCalendar:activeTab==='rekap'?icChartCol:activeTab==='laporan'?icFileChart:icFileText} className="w-4 h-4"/></div><div><div className="text-[13px] font-bold text-[#0B4F30]">FORM-KTR-01 - ONLINE Supabase - KEY Embedded</div><div className="text-[11px] text-slate-500">Tidak ada offline • Semua tersimpan cloud • User lain tinggal pakai file ini</div></div></div>
          </div>

          <div className="px-5 py-6">
            <div className="flex gap-2 mb-6 overflow-x-auto pb-2 scrollbar-hide">
              <TabBtn id="harian" label="Form Harian" icon={icClipCheck}/>
              <TabBtn id="bulanan" label="Form Bulanan" icon={icCalendar}/>
              <TabBtn id="rekap" label="Rekap Area" icon={icChartCol}/>
              <TabBtn id="laporan" label="Laporan KTR" icon={icFileChart}/>
              <TabBtn id="pendukung" label="Dokumen Pendukung" icon={icFileText}/>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6 text-[11px]">
              <div className="border rounded-lg px-3 py-2.5 bg-[#FCFFFD]"><div className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mb-1">Tanggal</div><input type="date" value={fTgl} onChange={e=>setFTgl(e.target.value)} className="w-full bg-transparent border-b pb-1 font-semibold outline-none"/></div>
              <div className="border rounded-lg px-3 py-2.5 bg-[#FCFFFD]"><div className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mb-1">Shift / Waktu</div><div className="flex gap-2"><select value={fShift} onChange={e=>setFShift(e.target.value)} className="bg-transparent border-b pb-1 font-semibold w-full outline-none"><option>Pagi</option><option>Siang</option><option>Malam</option></select><input type="time" value={fWaktu} onChange={e=>setFWaktu(e.target.value)} className="bg-transparent border-b pb-1 font-semibold w-full outline-none"/></div></div>
              <div className="border rounded-lg px-3 py-2.5 bg-[#FCFFFD]"><div className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold mb-1">Petugas KTR</div><input type="text" value={fPetugas1} onChange={e=>setFPetugas1(e.target.value)} placeholder="1. Nama Petugas" className="w-full bg-transparent border-b mb-1 outline-none text-[11px]"/><input type="text" value={fPetugas2} onChange={e=>setFPetugas2(e.target.value)} placeholder="2. Nama Petugas" className="w-full bg-transparent border-b outline-none text-[11px]"/></div>
              <div className="border rounded-lg px-3 py-2.5 bg-[#FCFFFD]"><div className="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Paraf Ka. Tim KTR</div><div className="mt-4 border-b border-dotted h-6"></div></div>
            </div>

            {activeTab==='harian' && (
              <div>
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-3"><div className="flex items-center gap-2"><h2 className="text-[14px] font-bold text-[#0B4F30]">Kendali Harian Patroli KTR</h2><span className="text-[10px] px-2 py-0.5 rounded-full bg-[#E7F3EC] text-[#0B4F30] font-semibold">ONLINE - Auto ke Bulanan & Rekap</span></div><button onClick={autoRekapFromCurrentHarian} className="px-3 py-1.5 bg-amber-500 text-white rounded-lg text-[11px] font-bold">⚡ Masukkan ke Bulanan & Rekap (Hari Ini)</button></div>
                <div className="flex justify-end mb-2 no-print"><button onClick={()=>printOnly('harianPrint')} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">🖨️ Cetak Harian - Hanya Isi</button></div><div id="harianPrint" className="overflow-x-auto border rounded-xl print-area"><table className="w-full border-collapse text-[11px] min-w-[980px]"><thead><tr className="bg-[#0B4F30] text-white"><th className="border border-[#0B4F30] px-2 py-2.5 w-[36px]">No</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[100px]">Waktu</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[160px] text-left">Lokasi / Area</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[80px]">Merokok?</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[80px]">Asbak?</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[80px]">Iklan?</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[60px]">Pelanggar</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[160px] text-left">Tindak Lanjut</th><th className="border border-[#0B4F30] px-2 py-2.5 w-[120px] text-left">Nama Petugas</th></tr></thead><tbody>{locations.map((loc,i)=>(<tr key={i} className={i%2===0?'bg-white':'bg-[#FBFFFC]'}><td className="border px-2 py-2 text-center">{i+1}</td><td className="border px-1 py-1"><input type="time" value={harianGrid[loc]?.waktu||''} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],waktu:e.target.value}})} className="w-full border rounded px-1 py-1"/></td><td className="border px-2 py-2"><div className="flex justify-between items-center"><span>{loc}</span><button onClick={()=>removeLocation(loc)} className="text-red-400 ml-2">×</button></div></td><td className="border px-1 py-1"><select value={harianGrid[loc]?.merokok||'Tidak'} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],merokok:e.target.value}})} className="w-full border rounded px-1 py-1"><option>Tidak</option><option>Ya</option></select></td><td className="border px-1 py-1"><select value={harianGrid[loc]?.asbak||'Tidak'} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],asbak:e.target.value}})} className="w-full border rounded"><option>Tidak</option><option>Ya</option></select></td><td className="border px-1 py-1"><select value={harianGrid[loc]?.iklan||'Tidak'} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],iklan:e.target.value}})} className="w-full border rounded"><option>Tidak</option><option>Ya</option></select></td><td className="border px-1 py-1"><input type="number" min="0" value={harianGrid[loc]?.pelanggar||0} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],pelanggar:e.target.value}})} className="w-full border rounded text-center"/></td><td className="border px-1 py-1"><input type="text" value={harianGrid[loc]?.tindak||''} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],tindak:e.target.value}})} className="w-full border rounded px-1"/></td><td className="border px-1 py-1"><input type="text" value={harianGrid[loc]?.nama||''} onChange={e=>setHarianGrid({...harianGrid,[loc]:{...harianGrid[loc],nama:e.target.value}})} className="w-full border rounded px-1"/></td></tr>))}<tr className="bg-slate-50"><td className="border px-2 text-center">+</td><td colSpan="8" className="border px-2 py-1"><div className="flex gap-2 max-w-sm"><input type="text" value={newLoc} onChange={e=>setNewLoc(e.target.value)} placeholder="Ketik area/lokasi baru..." className="flex-1 border rounded px-2 py-1 bg-white"/><button onClick={addLocation} className="bg-[#0B4F30] text-white px-3 py-1 rounded">Tambah Lokasi</button></div></td></tr></tbody></table></div>
                <div className="mt-6"><div className="text-[12px] font-bold text-[#0B4F30] mb-2">Riwayat Harian ONLINE</div><div className="grid gap-2 max-h-[200px] overflow-y-auto">{harianList.map(h=><div key={h.id} className="flex justify-between items-center border rounded-lg px-3 py-2 text-xs bg-slate-50"><span><strong>{h.tanggal}</strong> - {h.shift} by {h.created_by}</span><button onClick={()=>loadFromHistory('harian',h)} className="border px-3 py-1 rounded-full font-bold">Muat</button></div>)}</div></div>
              </div>
            )}

            {activeTab==='bulanan' && (

                <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-3"><h2 className="text-[14px] font-bold text-[#0B4F30]">Kendali Bulanan - Rekap Patroli & Pelanggaran (Auto dari Harian)</h2><div className="flex items-center gap-2"><button onClick={()=>autoRekapFullBulan(bulananBulan)} disabled={loading} className="px-3 py-1.5 bg-[#0B4F30] text-white rounded-lg text-[11px] font-bold disabled:opacity-50">🔄 Auto-Rekap dari Harian ({bulananBulan})</button><div className="flex items-center gap-2 text-[11px]">Bulan: <input type="month" value={bulananBulan} onChange={e=>setBulananBulan(e.target.value)} className="border rounded px-2 py-1"/></div></div></div>
                <div className="text-[10px] bg-[#E7F3EC] border border-[#D6E9DA] p-2 rounded-lg mb-3">💡 Data otomatis terisi dari Form Harian. Setiap kali simpan Harian, klik tombol di atas untuk tarik semua data bulan ini. Tidak perlu input ulang.</div>

me="w-full border rounded text-center"/></td><td className="border px-1 py-1"><input type="number" value={row.pasien||''} onChange={e=>setBulananGrid({...bulananGrid,[d]:{...row,pasien:e.target.value}})} className="w-full border rounded text-center"/></td><td className="border px-1 py-1 bg-slate-50"><input type="text" readOnly value={row.lokasi||''} className="w-full bg-slate-100 border rounded px-1"/></td><td className="border px-1 py-1 bg-slate-50"><input type="text" readOnly value={row.petugas||''} className="w-full bg-slate-100 border rounded px-1"/></td></tr>;})}</tbody></table></div>
                <div className="mt-6"><div className="text-[12px] font-bold text-[#0B4F30] mb-2">Riwayat Bulanan ONLINE</div><div className="grid gap-2 max-h-[200px] overflow-y-auto">{bulananList.map(b=><div key={b.id} className="flex justify-between items-center border rounded-lg px-3 py-2 text-xs bg-slate-50"><span><strong>{b.bulan}</strong> by {b.created_by}</span><button onClick={()=>loadFromHistory('bulanan',b)} className="border px-3 py-1 rounded-full font-bold">Muat</button></div>)}</div></div>
              </div>
            )}

            {activeTab==='rekap' && (
              <div>
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-1"><h2 className="text-[14px] font-bold text-[#0B4F30]">Rekapitulasi Bulanan Per Area & Trend (Auto)</h2><button onClick={()=>autoRekapFullBulan(rekapBulan)} disabled={loading} className="px-3 py-1.5 bg-[#0B4F30] text-white rounded-lg text-[11px] font-bold">🔄 Hitung Rekap Otomatis per Area ({rekapBulan})</button></div>
                <div className="text-[10px] bg-[#E7F3EC] border border-[#D6E9DA] p-2 rounded-lg mb-3">💡 Rekap per area & minggu otomatis dihitung dari total pelanggar di Form Harian. Minggu 1 = tgl 1-7, Minggu 2 = 8-14, Minggu 3 = 15-21, Minggu 4 = 22-31</div>
                <div className="flex items-center gap-2 mb-3 text-[11px]">Bulan: <input type="month" value={rekapBulan} onChange={e=>setRekapBulan(e.target.value)} className="border rounded px-2 py-1 bg-white"/></div>
                <div id="rekapPrint" className="overflow-x-auto border rounded-xl print-area"><div className="flex justify-end p-2 no-print"><button onClick={()=>printOnly('rekapPrint')} className="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-[11px] font-bold">🖨️ Cetak Rekap - Hanya Isi</button></div><table className="w-full border-collapse text-[11px] min-w-[780px]"><thead><tr className="bg-[#0B4F30] text-white"><th rowSpan={2} className="border border-[#0B4F30] px-3 py-2.5 text-left">Area / Lokasi</th><th colSpan={4} className="border border-[#0B4F30] px-2 py-1.5 border-b-0">Minggu Ke- (Total Pelanggar)</th><th rowSpan={2} className="border border-[#0B4F30] px-2 py-2.5">Total Bulan Ini</th><th rowSpan={2} className="border border-[#0B4F30] px-2 py-2.5">Bulan Lalu</th></tr><tr className="bg-[#0B4F30] text-white"><th className="border border-[#0B4F30] px-2 py-1.5 border-t-0">1</th><th className="border border-[#0B4F30] px-2 py-1.5 border-t-0">2</th><th className="border border-[#0B4F30] px-2 py-1.5 border-t-0">3</th><th className="border border-[#0B4F30] px-2 py-1.5 border-t-0">4</th></tr></thead><tbody>{locations.map((loc,i)=>{ const row=rekapGrid[loc]||{}; return <tr key={i} className={i%2===0?'bg-white':'bg-[#FBFFFC]'}><td className="border px-3 py-2 font-medium flex items-center gap-1.5"><Icon path={icMapPin} className="w-3 h-3 text-[#0B4F30]"/>{loc}</td><td className="border px-1 py-1 bg-slate-50"><input type="number" readOnly value={row.m1||''} className="w-full bg-slate-100 border rounded text-center"/></td><td className="border px-1 py-1 bg-slate-50"><input type="number" readOnly value={row.m2||''} className="w-full bg-slate-100 border rounded text-center"/></td><td className="border px-1 py-1 bg-slate-50"><input type="number" readOnly value={row.m3||''} className="w-full bg-slate-100 border rounded text-center"/></td><td className="border px-1 py-1 bg-slate-50"><input type="number" readOnly value={row.m4||''} className="w-full bg-slate-100 border rounded text-center"/></td><td className="border px-1 py-1 bg-amber-50"><input type="number" readOnly value={row.totalBulanIni||''} className="w-full bg-amber-100 border rounded text-center font-bold"/></td><td className="border px-1 py-1"><input type="number" value={row.bulanLalu||''} onChange={e=>setRekapGrid({...rekapGrid,[loc]:{...row,bulanLalu:e.target.value}})} className="w-full border rounded text-center"/></td></tr>;})}</tbody></table></div>
                <div className="mt-6"><div className="text-[12px] font-bold text-[#0B4F30] mb-2">Riwayat Rekap ONLINE</div><div className="grid gap-2 max-h-[200px] overflow-y-auto">{rekapList.map(r=><div key={r.id} className="flex justify-between items-center border rounded-lg px-3 py-2 text-xs bg-slate-50"><span><strong>{r.bulan}</strong> by {r.created_by}</span><button onClick={()=>loadFromHistory('rekap',r)} className="border px-3 py-1 rounded-full font-bold">Muat</button></div>)}</div></div>
              </div>
            )}

            {activeTab==='laporan' && (
              <div id="laporanPrint" className="max-w-[900px] mx-auto print-area"><div className="flex justify-between gap-2 mb-4 no-print"><button onClick={generateLaporanOtomatis} className="px-4 py-2 bg-[#0B4F30] text-white rounded-lg text-xs font-bold">✨ Buat Contoh Redaksi dari Data (Bisa Diedit)</button><button onClick={()=>handlePrint('laporan')} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold">🖨️ Cetak Laporan</button></div><div className="text-center border-b pb-4 mb-5"><div className="text-[14px] font-bold text-[#0B4F30]">LAPORAN BULANAN PELAKSANAAN KTR</div><div className="mt-2 text-[12px]">Bulan: <input type="month" value={lapBulan} onChange={e=>setLapBulan(e.target.value)} className="border-b bg-transparent outline-none"/></div></div><div className="space-y-4 text-[12px]"><section className="border rounded-lg p-3"><h3 className="font-bold text-[#0B4F30] mb-2">I. RINGKASAN PELAKSANAAN</h3><textarea value={lapRingkasan} onChange={e=>setLapRingkasan(e.target.value)} className="w-full h-24 border rounded p-2"/></section><div className="grid md:grid-cols-2 gap-4"><section className="border rounded-lg p-3"><h3 className="font-bold text-[#0B4F30] mb-2">II. KENDALA & SOLUSI</h3><textarea value={lapKendala} onChange={e=>setLapKendala(e.target.value)} className="w-full h-32 border rounded p-2"/></section><section className="border rounded-lg p-3 bg-[#F2F8F3]"><h3 className="font-bold text-[#0B4F30] mb-2">III. REKOMENDASI BULAN DEPAN</h3><textarea value={lapRekomendasi} onChange={e=>setLapRekomendasi(e.target.value)} className="w-full h-32 border rounded p-2 bg-white"/></section></div><div className="grid grid-cols-3 gap-6 pt-10 text-center"><div><div className="h-16"></div><input type="text" value={lapPelapor} onChange={e=>setLapPelapor(e.target.value)} placeholder="Nama Pelapor" className="text-center w-full border-t bg-transparent outline-none"/>Tim KTR</div><div><div className="h-16"></div><input type="text" value={lapMengetahui} onChange={e=>setLapMengetahui(e.target.value)} placeholder="Mengetahui" className="text-center w-full border-t bg-transparent outline-none"/>Kabid</div><div><div className="h-16"></div><input type="text" value={lapDirektur} onChange={e=>setLapDirektur(e.target.value)} placeholder="Direktur" className="text-center w-full border-t font-bold bg-transparent outline-none"/>Direktur</div></div></div></div>
            )}

            {activeTab==='pendukung' && (
              <div>
                <div className="flex gap-2 mb-5">{["checklist","ba","teguran"].map(st=><button key={st} onClick={()=>setSubTab(st)} className={`px-4 py-2 rounded-lg text-[12px] font-semibold border ${subTab===st?'bg-[#0B4F30] text-white':'bg-white'}`}>{st==="checklist"?"Checklist Sarana":st==="ba"?"Berita Acara":"Surat Teguran"}</button>)}</div>
                {subTab==="checklist" && <div id="checklistPrint" className="border border-slate-200 rounded-xl overflow-hidden print-area bg-white"><div className="flex justify-end p-2 no-print"><button onClick={()=>printOnly('checklistPrint')} className="px-3 py-1.5 bg-slate-800 text-white rounded-lg text-[11px] font-bold">🖨️ Cetak Checklist (Isi Saja)</button></div><table className="w-full text-[12px]"><thead><tr className="bg-[#0B4F30] text-white"><th className="px-3 py-2.5 text-center">No</th><th className="text-left px-3 py-2.5">Sarana KTR</th><th className="text-left px-3 py-2.5">Standar</th><th className="text-center px-3 py-2.5">Tersedia?</th><th className="text-center px-3 py-2.5">Kondisi</th><th className="text-left px-3 py-2.5">Tindak Lanjut / Keterangan</th></tr></thead><tbody>{defaultChecklist.map(r=>{const cg=checklistGrid[r.no]||{tersedia:'Ya',kondisi:'Baik',catatan:''}; return (<tr key={r.no} className="border-t border-slate-200"><td className="px-3 py-2.5 text-center">{r.no}</td><td className="px-3 py-2.5 font-medium">{r.sarana}</td><td className="px-3 py-2.5 text-slate-500 text-[11px]">{r.standar}</td><td className="px-2 py-2"><select value={cg.tersedia} onChange={e=>setChecklistGrid({...checklistGrid,[r.no]:{...cg,tersedia:e.target.value}})} className="w-full border border-slate-300 rounded px-1 py-1 text-center bg-white"><option>Ya</option><option>Tidak</option></select></td><td className="px-2 py-2"><select value={cg.kondisi} onChange={e=>setChecklistGrid({...checklistGrid,[r.no]:{...cg,kondisi:e.target.value}})} className="w-full border border-slate-300 rounded px-1 py-1 text-center bg-white"><option>Baik</option><option>Rusak</option><option>Perlu Perbaikan</option></select></td><td className="px-2 py-2"><input type="text" value={cg.catatan} onChange={e=>setChecklistGrid({...checklistGrid,[r.no]:{...cg,catatan:e.target.value}})} placeholder="Catatan..." className="w-full border border-slate-300 rounded px-2 py-1 bg-white" /></td></tr>)})}</tbody></table></div>}
                {subTab==="ba" && <div id="baPrint"><div className="flex justify-end mb-3 no-print"><button onClick={()=>printOnly('baContent')} disabled={!can(user,'cetak_BA')} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold disabled:opacity-40">🖨️ Cetak BA - Hanya Isi (Tanpa Header/Judul)</button></div><div id="baContent" className="max-w-[800px] mx-auto border border-slate-300 rounded-xl p-6 md:p-8 bg-[#FFFFFE] print-area"><div className="text-center mb-6"><div className="text-[14px] font-bold tracking-wide">BERITA ACARA PELANGGARAN KTR</div><div className="flex items-center justify-center gap-2 text-[12px] mt-2">Nomor: BA-KTR / <input type="text" value={baNomor} onChange={e=>setBaNomor(e.target.value)} className="border-b border-slate-400 bg-transparent w-32 text-center outline-none" /> / 20__</div></div><div className="text-[12px] space-y-4"><p>Pada hari ini, tanggal <input type="date" value={baTgl} onChange={e=>setBaTgl(e.target.value)} className="border-b border-slate-400 bg-transparent outline-none" /> bertempat di RSJD Atma Husada Mahakam, kami Tim Penegakan KTR:</p><div className="grid grid-cols-2 gap-4"><div>1. Nama: <input type="text" value={baPetugas1} onChange={e=>setBaPetugas1(e.target.value)} className="border-b border-slate-400 bg-transparent w-full mt-1 outline-none" /></div><div>Jabatan: <input type="text" value={baJab1} onChange={e=>setBaJab1(e.target.value)} className="border-b border-slate-400 bg-transparent w-full mt-1 outline-none" /></div><div>2. Nama: <input type="text" value={baPetugas2} onChange={e=>setBaPetugas2(e.target.value)} className="border-b border-slate-400 bg-transparent w-full mt-1 outline-none" /></div><div>Jabatan: <input type="text" value={baJab2} onChange={e=>setBaJab2(e.target.value)} className="border-b border-slate-400 bg-transparent w-full mt-1 outline-none" /></div></div><p>Telah menemukan pelanggaran KTR yang dilakukan oleh:</p><div className="border border-slate-200 rounded p-4 space-y-3"><div className="flex gap-4 items-center"><div className="w-32">Nama Pelanggar</div>: <input type="text" value={baPelanggar} onChange={e=>setBaPelanggar(e.target.value)} className="border-b border-slate-400 bg-transparent flex-1 outline-none" /></div><div className="flex gap-4 items-center"><div className="w-32">Status</div>: <select value={baStatus} onChange={e=>setBaStatus(e.target.value)} className="border border-slate-300 rounded px-2 py-1 bg-white"><option>Karyawan</option><option>Pengunjung</option><option>Pasien/Keluarga</option></select></div><div className="flex gap-4 items-center"><div className="w-32">Uraian Pelanggaran</div>: <input type="text" value={baUraian} onChange={e=>setBaUraian(e.target.value)} className="border-b border-slate-400 bg-transparent flex-1 outline-none" placeholder="Membawa asbak / merokok di area..." /></div><div className="flex gap-4 items-center"><div className="w-32">Tindak Lanjut</div>: <input type="text" value={baTindak} onChange={e=>setBaTindak(e.target.value)} className="border-b border-slate-400 bg-transparent flex-1 outline-none" placeholder="Edukasi dan teguran lisan..." /></div></div><div className="grid grid-cols-2 md:grid-cols-3 gap-6 pt-10 text-center"><div><div className="h-16"></div><input type="text" placeholder="Nama Pelanggar" className="text-center w-full bg-transparent border-t border-slate-400 pt-1 outline-none" /><div className="text-[10px]">Pelanggar</div></div><div><div className="h-16"></div><input type="text" placeholder="Nama Petugas 1" className="text-center w-full bg-transparent border-t border-slate-400 pt-1 outline-none" /><div className="text-[10px]">Petugas KTR 1</div></div><div><div className="h-16"></div><input type="text" placeholder="Nama Petugas 2" className="text-center w-full bg-transparent border-t border-slate-400 pt-1 outline-none" /><div className="text-[10px]">Petugas KTR 2 / Saksi</div></div></div></div></div></div>}
                {subTab==="teguran" && <div id="teguranPrint"><div className="flex justify-end mb-3 no-print"><button onClick={()=>printOnly('teguranContent')} disabled={!can(user,'cetak_Teguran')} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold disabled:opacity-40">🖨️ Cetak Teguran - Hanya Isi</button></div><div id="teguranContent" className="max-w-[800px] mx-auto border border-slate-300 rounded-xl p-6 md:p-8 bg-white print-area"><div className="flex justify-between items-start mb-6 text-[12px]"><div className="font-bold">RSJD ATMA HUSADA MAHAKAM<br/><span className="font-normal">Tim Penegakan KTR</span></div><div className="text-right">Samarinda, <input type="date" value={tgTglCetak} onChange={e=>setTgTglCetak(e.target.value)} className="border-b border-slate-400 bg-transparent outline-none" /><br/>No: <input type="text" value={tgNomor} onChange={e=>setTgNomor(e.target.value)} className="border-b border-slate-400 bg-transparent w-32 text-right outline-none" placeholder=".... /KTR/...." /></div></div><div className="text-center font-bold text-[14px] flex items-center justify-center gap-2 mb-6"><span className="text-amber-600">⚠</span> SURAT TEGURAN PELANGGARAN KTR</div><div className="text-[12px] space-y-4"><div>Kepada Yth,<br/>Sdr/i. <input type="text" value={tgNama} onChange={e=>setTgNama(e.target.value)} className="border-b border-slate-400 bg-transparent font-bold w-64 outline-none" /><br/>Di - Tempat</div><p className="text-justify">Sehubungan dengan pelaksanaan Peraturan Kawasan Tanpa Rokok (KTR) di lingkungan RSJD Atma Husada Mahakam berdasarkan Perda Kaltim No.5/2017, bersama ini kami sampaikan teguran atas pelanggaran:</p><div className="border border-amber-200 bg-amber-50 rounded-lg p-4 space-y-2"><div className="flex gap-2">Hari/Tgl: <input type="text" value={tgHariTgl} onChange={e=>setTgHariTgl(e.target.value)} className="border-b border-slate-400 bg-transparent flex-1 outline-none" /> Jam: <input type="time" value={tgJam} onChange={e=>setTgJam(e.target.value)} className="border-b border-slate-400 bg-transparent outline-none" /></div><div className="flex gap-2">Lokasi: <input type="text" value={tgLokasi} onChange={e=>setTgLokasi(e.target.value)} className="border-b border-slate-400 bg-transparent flex-1 outline-none" /></div><div className="flex gap-2 items-center">Pelanggaran: <input type="text" value={tgPelanggaran} onChange={e=>setTgPelanggaran(e.target.value)} className="border-b border-slate-400 bg-transparent flex-1 outline-none" placeholder="Contoh: Merokok di area parkir" /></div></div><p className="text-justify">Kami harapkan Saudara dapat mematuhi peraturan KTR demi kesehatan bersama dan kenyamanan pasien. Apabila masih melakukan pelanggaran, akan dikenakan sanksi sesuai ketentuan yang berlaku.</p><div className="flex justify-end pt-8"><div className="text-center text-[12px]">Ketua Tim Penegakan KTR,<br/><div className="h-20"></div><input type="text" value={tgKetua} onChange={e=>setTgKetua(e.target.value)} className="text-center w-48 bg-transparent border-t border-slate-400 pt-1 outline-none" placeholder="Nama Lengkap & NIP" /></div></div></div></div></div>}
              </div>
            )}
          </div>
        </div>
      </div>

      <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t shadow-[0_-4px_15px_rgba(0,0,0,0.08)] z-40">
        <div className="max-w-[1280px] mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
          <div className="flex items-center gap-2 text-xs"><span className={`w-2 h-2 rounded-full ${dbStatus==='connected'?'bg-emerald-500 animate-pulse':'bg-red-500'}`}></span>{dbStatus==='connected'?'ONLINE - Database Cloud Aktif':'OFFLINE - '+dbErrorDetail} <span className="hidden md:inline-flex ml-2 text-[10px] bg-[#F3FBF5] border border-[#D6E9DA] px-2 py-1 rounded-full">KEY Embedded - Tanpa input ulang</span></div>
          <div className="flex gap-2 w-full md:w-auto">
            <button onClick={muatDataSupabase} disabled={loading||dbStatus!=='connected'} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl border text-sm font-bold disabled:opacity-40"><Icon path={icCloud} className="w-4 h-4"/>{loading?'Memuat...':'Muat Data'}</button>
            <button onClick={simpanDataSupabase} disabled={loading||dbStatus!=='connected'} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl bg-[#0B4F30] text-white text-sm font-bold shadow-lg disabled:opacity-40"><Icon path={icSave} className="w-4 h-4"/>{loading?'Menyimpan...':'Simpan ke Database'}</button>
          </div>
        </div>
      </div>

      {showChangePass&&<div className="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center p-4"><div className="bg-white rounded-[24px] p-6 w-full max-w-md"><div className="font-bold text-[#0B4F30] mb-1 flex items-center gap-2"><Icon path={icLock} className="w-5 h-5"/>{changePassTarget?`Ganti Password: ${changePassTarget}`:'Ganti Password Saya'}</div><p className="text-xs text-slate-500 mb-4">Fitur untuk role editor.</p><div className="space-y-3">{(!changePassTarget||changePassTarget===user?.username)&&<input type="password" value={oldPassInput} onChange={e=>setOldPassInput(e.target.value)} placeholder="Password Lama" className="w-full border rounded-xl px-3 py-2.5"/>}<input type="password" value={newPassInput} onChange={e=>setNewPassInput(e.target.value)} placeholder="Password Baru" className="w-full border rounded-xl px-3 py-2.5"/><input type="password" value={confirmPassInput} onChange={e=>setConfirmPassInput(e.target.value)} placeholder="Konfirmasi" className="w-full border rounded-xl px-3 py-2.5"/></div><div className="flex gap-2 mt-6"><button onClick={()=>setShowChangePass(false)} className="flex-1 border rounded-xl py-2.5">Batal</button><button onClick={handleChangePassword} className="flex-1 bg-[#0B4F30] text-white rounded-xl py-2.5">Simpan</button></div></div></div>}
      {toast&&<div className={`fixed bottom-28 left-1/2 -translate-x-1/2 px-5 py-3 rounded-xl text-sm font-bold shadow-2xl z-[200] max-w-[90%] text-center ${toast.type==='error'?'bg-red-600 text-white':toast.type==='success'?'bg-[#0B4F30] text-white':'bg-amber-500 text-white'}`}>{toast.msg}</div>}
    </div>
  );
}
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
